<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Imprimir · RAG Extractor</title>
<style>
  :root {
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }

  body {
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.7;
    color: #111;
    background: #fff;
    margin: 0;
    padding: 32px 48px;
    max-width: 860px;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #ddd;
  }
  #toolbar h2 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toolbar button {
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #f5f5f5;
    color: #333;
  }
  #toolbar button.primary { background: #1a7f5a; color: #fff; border-color: #1a7f5a; font-weight: 600; }
  #toolbar button.primary:hover { background: #15694a; }

  .content h1 { font-size: 20px; margin: 0 0 16px; }
  .content h2 { font-size: 16px; margin: 20px 0 8px; }
  .content h3 { font-size: 13px; margin: 14px 0 6px; font-weight: 700; }
  .content p  { margin: 0 0 10px; }
  .content ul, .content ol { margin: 0 0 10px; padding-left: 20px; }
  .content li { margin-bottom: 3px; }
  .content code { font: 11px var(--mono); background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
  .content pre  { background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; padding: 12px; overflow: auto; }
  .content table { border-collapse: collapse; width: 100%; margin-bottom: 12px; font-size: 12px; }
  .content th, .content td { border: 1px solid #ccc; padding: 5px 8px; text-align: left; }
  .content th { background: #f0f0f0; font-weight: 700; }
  .content a { color: #1a7f5a; }
  .content strong, .content b { font-weight: 700; }
  .content em { font-style: italic; }

  .meta { font: 11px var(--mono); color: #888; margin-bottom: 18px; }

  @media print {
    #toolbar { display: none; }
    body { padding: 0; }
  }
</style>
</head>
<body>
  <div id="toolbar">
    <h2 id="toolbar-title"></h2>
    <button onclick="window.close()">Fechar</button>
    <button class="primary" onclick="window.print()">🖨 Imprimir / PDF</button>
  </div>
  <div class="meta" id="doc-meta"></div>
  <div class="content" id="content"></div>

<script type="module">
async function init() {
  const stored = await chrome.storage.local.get('rag_print_pending');
  const data = stored.rag_print_pending;
  if (!data) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#888">Nenhum conteúdo para imprimir.</div>';
    return;
  }

  document.title = (data.title || 'Documento') + ' · Imprimir';
  document.getElementById('toolbar-title').textContent = data.title || '';

  const metaParts = [];
  if (data.type) metaParts.push('tipo: ' + data.type);
  if (data.tags) metaParts.push('tags: ' + data.tags);
  document.getElementById('doc-meta').textContent = metaParts.join('  ·  ');

  document.getElementById('content').innerHTML = renderMarkdown(data.content || '');

  await chrome.storage.local.remove('rag_print_pending');
}

function renderMarkdown(src) {
  if (!src) return '';
  // strip frontmatter
  src = src.replace(/^---\n[\s\S]*?\n---\n?/, '');
  const lines = src.split('\n');
  const out = [];
  let inList = false, inTable = false;
  for (let i = 0; i < lines.length; i++) {
    let l = lines[i];
    if (/^### /.test(l)) { closeAll(); out.push('<h3>' + esc(l.slice(4)) + '</h3>'); continue; }
    if (/^## /.test(l))  { closeAll(); out.push('<h2>' + esc(l.slice(3)) + '</h2>'); continue; }
    if (/^# /.test(l))   { closeAll(); out.push('<h1>' + esc(l.slice(2)) + '</h1>'); continue; }
    if (/^\s*[-*] /.test(l)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push('<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>'); continue;
    }
    if (/^\|.*\|/.test(l)) {
      const cells = l.split('|').slice(1,-1).map(c => c.trim());
      if (!inTable) { out.push('<table><thead><tr>' + cells.map(c=>'<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>'); inTable = true; i++; continue; }
      out.push('<tr>' + cells.map(c=>'<td>'+inline(c)+'</td>').join('') + '</tr>'); continue;
    }
    closeAll();
    if (l.trim()) out.push('<p>' + inline(l) + '</p>');
  }
  closeAll();
  function closeAll() { if (inList) { out.push('</ul>'); inList = false; } if (inTable) { out.push('</tbody></table>'); inTable = false; } }
  return out.join('\n');
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

init();
</script>
</body>
</html>
